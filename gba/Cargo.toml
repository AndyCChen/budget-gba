[package]
name = "gba"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]  # Compile this crate to a dynamic C library.

[dependencies]
bitfield-struct = "0.11"
num-traits = "0.2.19"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0"
register_macros = { path = "register_macros"  }
paste = "1.0.15"
godot = "0.4.5"
