[package]
name = "BudgetGba"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["app","gba"]

[dependencies]
app = { path = "./app" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
